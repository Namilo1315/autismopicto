<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./estilo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictograma Interactivo</title>
    <link rel="icon" type="image/jpg" href="imagenes/carita feliz.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .btn-return { background-color: #ff2534; color: #000; }
        .btn-want { background-color: #33db44; color: #000; }
        .btn-dont-want { background-color: #fab866; color: #000; }
        .btn-like { background-color: #28accd; color: #000; }
        .btn-dislike { background-color: #ffcc25; color: #000; }
        .btn-thanks { background-color: #f7eb65; color: #000; }
        .btn-please { background-color: #44dfd5; color: #000; }
        .bg-blue-pastel { background-color: #5ebff4; color: #000; }
        .bg-yellow-pastel { background-color: #f5d63c; color: #000; }
        .bg-green-pastel { background-color: #43fb55; color: #000; }
        .bg-orange-pastel { background-color: #f79845; color: #000; }
        .bg-pink-pastel { background-color: #f4878f; color: #000; }
        .bg-light-blue { background-color: #48b4cf; color: #000; }
        .bg-light-green { background-color: #76e63f; color: #000; }
        .bg-light-purple { background-color: #d67ce6; color: #000; }
        .bg-yellow-light { background-color: #f7eb65; color: #000; }
        .bg-turquoise { background-color: #44dfd5; color: #000; }
        .bg-coral-light { background-color: #f6c170; color: #000; }
        .bg-mint { background-color: #ff3c23db; color: #000; }
    </style>
</head>
<body>

    <div class="container mt-1">
        <div class="row">
            <div class="col text-center">
                <a href="./pictogramas.html"><button type="button" class="btn btn-return btn-lg m-2 img-carita" id="volver">VOLVER</button></a>
                <img src="./imagenes/niña.png" alt="Manzana" class="pictograma" data-word="YO" width="50PX">
                <button type="button" class="btn btn-want btn- m-2 img-carita" id="">QUIERO</button>
                <button type="button" class="btn btn-dont-want btn- m-2 img-carita" id="">ME SIENTO</button>
                <button type="button" class="btn btn-like btn- m-2 img-carita" id="">ESTOY</button>
                <button type="button" class="btn btn-dislike btn- m-2 img-carita" id="">NO ESTOY</button>
                <button type="button" class="btn btn-thanks btn- m-2 img-carita" id="">GRACIAS</button>
                <button type="button" class="btn btn-please btn- m-2 img-carita" id="">POR FAVOR</button>
            </div>
        </div>
    </div>

    <section>
        <div class="container">
            <h4 class="fw-bold bg-yellow-light py-2 fw-bold">ARMAMOS LA FRASE:</h4>
            <div class="d-flex flex-wrap mb-3 border p-3" id="phrase-container"></div>
            <button class="btn btn-like mb-2" id="reproducir-frase">Reproducir</button>
            <button class="btn btn-return mb-2" id="limpiar-frase">Limpiar</button>
        </div>
    </section>

    <div class="container mt-1">
        <div class="row ">
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/contento.png" alt="Manzana" class="pictograma" data-word="felíz" width="50">
                <p class=" fw-bold">FELÍZ</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/enfado.png" alt="Banana" class="pictograma" data-word="enojado" width="70">
                <p class="fw-bold">ENOJADO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/triste.png" alt="Naranja" class="pictograma" data-word="triste" width="50">
                <p class="fw-bold">TRISTE</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/enamorado.png" alt="Manzana" class="pictograma" data-word="con amor" width="50">
                <p class="fw-bold">AMOR</p>
            </div>
        
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/asco.png" alt="Naranja" class="pictograma" data-word="asco" width="50">
                <p class="fw-bold">ASCO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/ansioso.png" alt="Naranja" class="pictograma" data-word="ANSIOSO" width="50">
                <p class="fw-bold">ANSIOSO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/avergonzar.png" alt="Naranja" class="pictograma" data-word="vergüenza" width="50">
                <p class="fw-bold">VERGÜENZA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/confusión.png" alt="Naranja" class="pictograma" data-word="confusión" width="50">
                <p class="fw-bold">CONFUSIÓN</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/aburrimiento.png" alt="Naranja" class="pictograma" data-word="aburrido" width="50">
                <p class="fw-bold">ABURRIDO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/amor (1).png" alt="Naranja" class="pictograma" data-word="te amo" width="50">
                <p class="fw-bold">TE AMO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/tener miedo.png" alt="Naranja" class="pictograma" data-word="miedo" width="50">
                <p class="fw-bold">MIEDO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/furioso.png" alt="Naranja" class="pictograma" data-word="muy enojado" width="50">
                <p class="fw-bold">MUY ENOJADO</p>
            </div>
           
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/divertir.png" alt="Naranja" class="pictograma" data-word="divertido" width="50">
                <p class="fw-bold">DIVERTIDO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/estoy bien.png" alt="Naranja" class="pictograma" data-word="estoy bien" width="50">
                <p class="fw-bold">ESTOY BIEN</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/estoy mal.png" alt="Naranja" class="pictograma" data-word="estoy mal" width="50">
                <p class="fw-bold">ESTOY MAL</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/saturado.png" alt="Naranja" class="pictograma" data-word="saturado" width="50">
                <p class="fw-bold">SATURADO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/sorpresa.png" alt="Naranja" class="pictograma" data-word="sorpresa" width="50">
                <p class="fw-bold">SORPRESA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/sentimientos/envidia.png" alt="Naranja" class="pictograma" data-word="envidia" width="50">
                <p class="fw-bold">ENVIDIA</p>
            </div>

            
            
            
        </div>
    </div>

    <section>
        <div class="container">
            <h3 class=" fw-bold bg-yellow-light py-2"> ¡Vamos a Practicar!</h3>
            <div class="text-to-speech">
                <textarea class="fw-bold " id="text-input" placeholder="Escribe algo aquí..."></textarea>
                <div class="buttons">
                    <button class="l1" id="speak-button">Reproducir</button>
                    <button class="2" id="clear-button">Borrar</button>
                </div>
            </div>
        </div>
     </section>

    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
