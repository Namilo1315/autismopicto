<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
    <meta name="description" content="Sitio especializado en pictogramas para comunicación">
    <meta name="keywords" content="pictogramas, comunicación, autismo, frases, pictogramas educativos">
    <link rel="icon" type="image/jpg" href="./imagenes/carita_feliz.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="estilo.css">
    <title>Armando Pictogramas</title>
</head>

<body>
    <!-- SECCIÓN INICIO -->
    <section id="inicio">
        <div class="container mt-5">
            <div class="row">
                <div class="col text-center">
                    <h1 class="fw-bold">Selecciona tus Pictogramas</h1>
                </div>
            </div>

            <!-- Sección de Categorías -->
            <div class="row mt-4">
                <div class="col-md-3 col-xs-4 text-center">
                    <button class="btn btn-primary category-btn" data-category="familia">FAMILIA</button>
                </div>
                <div class="col-md-3 col-xs-4 text-center">
                    <button class="btn btn-primary category-btn" data-category="sentimientos">SENTIMIENTOS</button>
                </div>
                <div class="col-md-3 col-xs-4 text-center">
                    <button class="btn btn-primary category-btn" data-category="rutinas">RUTINA DIARIA</button>
                </div>
                
            </div>

            <!-- Buscador de Pictogramas -->
            <div class="row mt-4">
                <div class="col-md-6 offset-md-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Busca un pictograma...">
                </div>
            </div>

            <!-- Sección de Pictogramas -->
            <div id="pictogramGrid" class="row mt-4">
                <!-- Aquí se insertarán los pictogramas -->
            </div>

            <!-- Área de Selección Personalizada -->
            <h2 class="mt-5 text-center">Pictogramas Seleccionados</h2>
            <div id="selectedPictograms" class="d-flex flex-wrap justify-content-center mt-3 p-3 border">
                <!-- Aquí aparecerán los pictogramas seleccionados -->
            </div>

            <div class="text-center mt-4">
                <button id="reproducir-frase" class="btn btn-primary">Reproducir Frase</button>
                <button id="limpiar-frase" class="btn btn-danger">Limpiar Frase</button>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./index.js"></script>
</body>

</html>
