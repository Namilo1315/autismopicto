<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./estilo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictograma Interactivo</title>
    <link rel="icon" type="image/jpg" href="imagenes/carita feliz.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .btn-return { background-color: #ff2534; color: #000; }
        .btn-want { background-color: #33db44; color: #000; }
        .btn-dont-want { background-color: #fab866; color: #000; }
        .btn-like { background-color: #28accd; color: #000; }
        .btn-dislike { background-color: #ffcc25; color: #000; }
        .btn-thanks { background-color: #f7eb65; color: #000; }
        .btn-please { background-color: #44dfd5; color: #000; }
        .bg-blue-pastel { background-color: #5ebff4; color: #000; }
        .bg-yellow-pastel { background-color: #f5d63c; color: #000; }
        .bg-green-pastel { background-color: #43fb55; color: #000; }
        .bg-orange-pastel { background-color: #f79845; color: #000; }
        .bg-pink-pastel { background-color: #f4878f; color: #000; }
        .bg-light-blue { background-color: #48b4cf; color: #000; }
        .bg-light-green { background-color: #76e63f; color: #000; }
        .bg-light-purple { background-color: #d67ce6; color: #000; }
        .bg-yellow-light { background-color: #f7eb65; color: #000; }
        .bg-turquoise { background-color: #44dfd5; color: #000; }
        .bg-coral-light { background-color: #f6c170; color: #000; }
        .bg-mint { background-color: #ff3c23db; color: #000; }
    </style>
</head>
<body>

    <div class="container mt-1">
        <div class="row">
            <div class="col text-center">
                <a href="./pictogramas.html"><button type="button" class="btn btn-return btn-lg m-2 img-carita" id="volver">VOLVER</button></a>
                <img src="./imagenes/niña.png" alt="Manzana" class="pictograma" data-word="YO" width="60PX">
                <button type="button" class="btn btn-want btn- m-2 img-carita" id="quiero">QUIERO</button>
                <button type="button" class="btn btn-dont-want btn- m-2 img-carita" id="noquiero">NO QUIERO</button>
                <button type="button" class="btn btn-like btn- m-2 img-carita" id="megusta">ME GUSTA</button>
                <button type="button" class="btn btn-dislike btn- m-2 img-carita" id="nomegusta">NO ME GUSTA</button>
                <button type="button" class="btn btn-thanks btn- m-2 img-carita" id="gracias">GRACIAS</button>
                <button type="button" class="btn btn-please btn- m-2 img-carita" id="porfavor">POR FAVOR</button>
            </div>
        </div>
    </div>

    <section>
        <div class="container">
            <h4 class="fw-bold bg-yellow-light py-2 fw-bold">ARMAMOS LA FRASE:</h4>
            <div class="d-flex flex-wrap mb-3 border p-3" id="phrase-container"></div>
            <button class="btn btn-like mb-2" id="reproducir-frase">Reproducir</button>
            <button class="btn btn-return mb-2" id="limpiar-frase">Limpiar</button>
        </div>
    </section>

    <div class="container mt-1">
        <div class="row">
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/abrazo.png" alt="Abrazo" class="pictograma" data-word="abrazo" width="50">
                <p class="fw-bold">ABRAZO</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/cepillar los dientes.png" alt="Cepillar los dientes" class="pictograma" data-word="cepillar los dientes" width="50">
                <p class="fw-bold">CEPILLAR LOS DIENTES</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/comer (1).png" alt="Comer" class="pictograma" data-word="comer" width="50">
                <p class="fw-bold">COMER</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/desayunar.png" alt="Desayunar" class="pictograma" data-word="desayunar" width="50">
                <p class="fw-bold">DESAYUNAR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/despertar.png" alt="Despertar" class="pictograma" data-word="despertar" width="50">
                <p class="fw-bold">DESPERTAR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/dormir.png" alt="Dormir" class="pictograma" data-word="dormir" width="50">
                <p class="fw-bold">DORMIR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/ducha (2).png" alt="Duchar" class="pictograma" data-word="duchar" width="50">
                <p class="fw-bold">DUCHAR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/ducha.png" alt="Ducha" class="pictograma" data-word="ducha" width="50">
                <p class="fw-bold">DUCHA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/enjabonar la cara.png" alt="Enjabonar la cara" class="pictograma" data-word="lavar la cara" width="50">
                <p class="fw-bold">LAVAR LA CARA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/escuela infantil.png" alt="Escuela Infantil" class="pictograma" data-word="IR A TERAPIA" width="50">
                <p class="fw-bold">IR A TERAPIA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/escuela.png" alt="Escuela" class="pictograma" data-word="escuela" width="50">
                <p class="fw-bold">ESCUELA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/estudiar.png" alt="Estudiar" class="pictograma" data-word="estudiar" width="50">
                <p class="fw-bold">ESTUDIAR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/hacer pis.png" alt="Hacer Pis" class="pictograma" data-word="hacer pis" width="50">
                <p class="fw-bold">HACER PIS</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/jugar a la pelota.png" alt="Jugar a la pelota" class="pictograma" data-word="jugar a la pelota" width="50">
                <p class="fw-bold">JUGAR A LA PELOTA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/jugar al ajedrez.png" alt="Jugar al ajedrez" class="pictograma" data-word="jugar al ajedrez" width="50">
                <p class="fw-bold">JUGAR AL AJEDREZ</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/jugar al corro.png" alt="Jugar al corro" class="pictograma" data-word="jugar " width="50">
                <p class="fw-bold">JUGAR</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/jugar con el tablet.png" alt="Jugar con tablet" class="pictograma" data-word="jugar con tablet" width="50">
                <p class="fw-bold">JUGAR CON TABLET</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/lavado de manos.png" alt="Lavado de manos" class="pictograma" data-word="lavado de manos" width="50">
                <p class="fw-bold">LAVADO DE MANOS</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/lavar la cara.png" alt="Lavado de cara" class="pictograma" data-word="lavado de cara" width="50">
                <p class="fw-bold">LAVADO DE CARA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/levantar de la cama.png" alt="Levantar de la cama" class="pictograma" data-word="levantar de la cama" width="50">
                <p class="fw-bold">LEVANTAR DE LA CAMA</p>
            </div>
            <div class="col-lg-2 col-md-3 col-sm-3 col-xs-4 text-center">
                <img src="./imagenes/rutinas/peinar.png" alt="Peinar" class="pictograma" data-word="peinar" width="50">
                <p class="fw-bold">PEINAR</p>
            </div>
        </div>
    </div>
    

    <section>
        <div class="container">
            <div class="text-to-speech">
                <textarea class="form-control mt-3 fw-bold" id="text-input" placeholder="Escribe algo aquí..."></textarea>
                <button class="btn btn-like mt-2" id="speak-button">Reproducir texto</button>
                <button class="btn btn-return mt-2" id="clear-button">Borrar texto</button>
            </div>
        </div>
    </section>

    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
